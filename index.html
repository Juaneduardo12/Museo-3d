<!DOCTYPE html>

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Museo Virtual de Tecnología</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #101820;
        }

        #activar-sensores {
            position: fixed;
            z-index: 99999;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 14px 24px;

            border: none;
            border-radius: 12px;

            background: #00a8ff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);

            cursor: pointer;
        }

        #activar-sensores:hover {
            background: #008ed6;
        }

        #activar-sensores:active {
            transform: translateX(-50%) scale(0.95);
        }

        #ayuda {
            position: fixed;
            z-index: 9998;
            left: 15px;
            bottom: 15px;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            border-radius: 8px;

            font-size: 13px;

            pointer-events: none;
        }

        @media (max-width: 700px) {

            #ayuda {
                font-size: 11px;
                max-width: 220px;
            }
        }
    </style>
</head>

<script>


/* ============================================================
   VARIABLES DE TECLADO
============================================================ */

const teclas = {

    w: false,
    a: false,
    s: false,
    d: false,
    shift: false

};



/* ============================================================
   COMPONENTE DE INFORMACIÓN
============================================================ */

AFRAME.registerComponent('mostrar-informacion', {

    init: function () {

        this.el.addEventListener('click', () => {

            const tituloInfo =
                this.el.getAttribute('data-titulo');

            const textoInfo =
                this.el.getAttribute('data-info');

            const panel =
                document.querySelector('#panel-info');

            const titulo =
                document.querySelector('#info-titulo');

            const texto =
                document.querySelector('#info-texto');


            if (!panel || !titulo || !texto) {

                console.error(
                    'No se encontró el panel de información.'
                );

                return;
            }


            titulo.setAttribute(
                'value',
                tituloInfo
            );


            texto.setAttribute(
                'value',
                textoInfo
            );


            const x =
                parseFloat(
                    this.el.getAttribute('data-panel-x')
                );


            const y =
                parseFloat(
                    this.el.getAttribute('data-panel-y')
                );


            const z =
                parseFloat(
                    this.el.getAttribute('data-panel-z')
                );


            if (
                Number.isNaN(x) ||
                Number.isNaN(y) ||
                Number.isNaN(z)
            ) {

                console.error(
                    'Posición del panel inválida.'
                );

                return;
            }


            panel.setAttribute(
                'position',
                `${x} ${y} ${z}`
            );


            /*
             * El panel mira hacia el pasillo.
             */

            panel.setAttribute(
                'rotation',
                '0 0 0'
            );


            panel.setAttribute(
                'visible',
                'true'
            );

        });

    }

});



/* ============================================================
   BOTÓN CERRAR
============================================================ */

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const botonCerrar =
            document.querySelector('#btn-cerrar');

        const panel =
            document.querySelector('#panel-info');


        if (botonCerrar && panel) {

            botonCerrar.addEventListener(
                'click',
                function () {

                    panel.setAttribute(
                        'visible',
                        'false'
                    );

                }
            );

        }

    }
);



/* ============================================================
   TECLADO
============================================================ */

document.addEventListener(
    'keydown',
    function (event) {

        const tecla =
            event.key.toLowerCase();


        switch (tecla) {

            case 'w':

                teclas.w = true;

                event.preventDefault();

                break;


            case 'a':

                teclas.a = true;

                event.preventDefault();

                break;


            case 's':

                teclas.s = true;

                event.preventDefault();

                break;


            case 'd':

                teclas.d = true;

                event.preventDefault();

                break;

        }


        if (event.key === 'Shift') {

            teclas.shift = true;

        }

    }
);



/* ============================================================
   SOLTAR TECLAS
============================================================ */

document.addEventListener(
    'keyup',
    function (event) {

        const tecla =
            event.key.toLowerCase();


        switch (tecla) {

            case 'w':
                teclas.w = false;
                break;

            case 'a':
                teclas.a = false;
                break;

            case 's':
                teclas.s = false;
                break;

            case 'd':
                teclas.d = false;
                break;

        }


        if (event.key === 'Shift') {

            teclas.shift = false;

        }

    }
);



/* ============================================================
   MOVIMIENTO DE CÁMARA
============================================================ */

AFRAME.registerComponent(
    'teclado-movimiento',
    {

        init: function () {

            this.velocidadNormal = 3.5;

            this.velocidadCorrer = 7;

            this.limiteX = 32;

            this.limiteZMin = -72;

            this.limiteZMax = 3;


            this.posicionAnterior =
                new THREE.Vector3();

        },


        tick: function (time, delta) {

            if (!delta) {

                return;

            }


            const posicion =
                this.el.object3D.position;


            const rotacion =
                this.el.object3D.rotation;


            /*
             * Guardamos posición anterior.
             */

            this.posicionAnterior.copy(
                posicion
            );


            /*
             * Velocidad.
             */

            let velocidad =
                this.velocidadNormal;


            if (teclas.shift) {

                velocidad =
                    this.velocidadCorrer;

            }


            const movimiento =
                velocidad *
                (delta / 1000);


            /*
             * Dirección frontal.
             */

            const direccionX =
                -Math.sin(rotacion.y);


            const direccionZ =
                -Math.cos(rotacion.y);


            /*
             * W
             */

            if (teclas.w) {

                posicion.x +=
                    direccionX *
                    movimiento;

                posicion.z +=
                    direccionZ *
                    movimiento;

            }


            /*
             * S
             */

            if (teclas.s) {

                posicion.x -=
                    direccionX *
                    movimiento;

                posicion.z -=
                    direccionZ *
                    movimiento;

            }


            /*
             * A
             */

            if (teclas.a) {

                posicion.x -=
                    Math.cos(rotacion.y) *
                    movimiento;

                posicion.z +=
                    Math.sin(rotacion.y) *
                    movimiento;

            }


            /*
             * D
             */

            if (teclas.d) {

                posicion.x +=
                    Math.cos(rotacion.y) *
                    movimiento;

                posicion.z -=
                    Math.sin(rotacion.y) *
                    movimiento;

            }


            /*
             * Altura fija.
             */

            posicion.y = 3;


            /*
             * Límites generales del museo.
             */

            posicion.x =
                Math.max(
                    -33,
                    Math.min(
                        33,
                        posicion.x
                    )
                );


            posicion.z =
                Math.max(
                    -72,
                    Math.min(
                        3,
                        posicion.z
                    )
                );

        }

    }
);



/* ============================================================
   SENSORES DEL CELULAR
============================================================ */

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const boton =
            document.querySelector(
                '#activar-sensores'
            );


        if (!boton) {

            return;

        }


        boton.addEventListener(
            'click',
            async function () {


                /*
                 * iPhone / iPad
                 */

                if (

                    typeof DeviceOrientationEvent !==
                    'undefined' &&

                    typeof DeviceOrientationEvent
                        .requestPermission ===
                    'function'

                ) {

                    try {

                        const permiso =
                            await DeviceOrientationEvent
                                .requestPermission();


                        if (permiso === 'granted') {

                            console.log(
                                'Sensores activados correctamente.'
                            );


                            boton.style.display =
                                'none';

                        } else {

                            alert(
                                'No se concedió permiso para utilizar los sensores.'
                            );

                        }

                    } catch (error) {

                        console.error(
                            'Error al activar sensores:',
                            error
                        );

                        alert(
                            'No fue posible activar los sensores.'
                        );

                    }

                }


                /*
                 * Android / otros navegadores
                 */

                else {

                    console.log(
                        'Movimiento del dispositivo disponible.'
                    );


                    boton.style.display =
                        'none';

                }

            }
        );

    }
);



/* ============================================================
   EVITAR TECLAS ATASCADAS
============================================================ */

window.addEventListener(
    'blur',
    function () {

        teclas.w = false;
        teclas.a = false;
        teclas.s = false;
        teclas.d = false;
        teclas.shift = false;

    }
);



/* ============================================================

============================================================ */

document.addEventListener(
    'keydown',
    function (event) {

        if (event.key === 'Escape') {

            const panel =
                document.querySelector(
                    '#panel-info'
                );


            if (panel) {

                panel.setAttribute(
                    'visible',
                    'false'
                );

            }

        }

    }
);
