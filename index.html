    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #101820;
        }

        /* ==============================
           BOTÓN SENSORES
        ============================== */

        #activar-sensores {
            position: fixed;
            z-index: 9999;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 14px 22px;

            border: none;
            border-radius: 10px;

            background: #00a8ff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);

            cursor: pointer;
        }

        #activar-sensores:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* ==============================
           AYUDA DE CONTROLES
        ============================== */

        #controles {
            position: fixed;
            z-index: 9998;
            bottom: 15px;
            left: 15px;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            border-radius: 8px;

            font-size: 13px;

            pointer-events: none;
        }

        /* Ocultar ayuda al entrar en VR */
        .a-enter-vr-button {
            z-index: 10000;
        }
    </style>
</head>

    <script>


        /* =====================================================
           VARIABLES GENERALES
        ===================================================== */

        const teclas = {
            w: false,
            a: false,
            s: false,
            d: false,
            shift: false
        };


        /* =====================================================
           COMPONENTE INFORMACIÓN
        ===================================================== */

        AFRAME.registerComponent('mostrar-informacion', {

            init: function () {

                this.el.addEventListener('click', () => {

                    const tituloInfo =
                        this.el.getAttribute('data-titulo');

                    const textoInfo =
                        this.el.getAttribute('data-info');

                    const panel =
                        document.querySelector('#panel-info');

                    const titulo =
                        document.querySelector('#info-titulo');

                    const texto =
                        document.querySelector('#info-texto');


                    if (!panel || !titulo || !texto) {

                        console.error(
                            'No se encontró el panel de información.'
                        );

                        return;
                    }


                    titulo.setAttribute(
                        'value',
                        tituloInfo
                    );


                    texto.setAttribute(
                        'value',
                        textoInfo
                    );


                    const x =
                        parseFloat(
                            this.el.getAttribute(
                                'data-panel-x'
                            )
                        );

                    const y =
                        parseFloat(
                            this.el.getAttribute(
                                'data-panel-y'
                            )
                        );

                    const z =
                        parseFloat(
                            this.el.getAttribute(
                                'data-panel-z'
                            )
                        );


                    panel.setAttribute(
                        'position',
                        `${x} ${y} ${z}`
                    );


                    panel.setAttribute(
                        'rotation',
                        '0 0 0'
                    );


                    panel.setAttribute(
                        'visible',
                        'true'
                    );

                });

            }

        });


        /* =====================================================
           BOTÓN CERRAR
        ===================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                const botonCerrar =
                    document.querySelector(
                        '#btn-cerrar'
                    );

                const panel =
                    document.querySelector(
                        '#panel-info'
                    );


                if (botonCerrar) {

                    botonCerrar.addEventListener(
                        'click',
                        function () {

                            panel.setAttribute(
                                'visible',
                                'false'
                            );

                        }
                    );

                }

            }
        );


        /* =====================================================
           TECLADO
           
           Se utilizan event.code y event.key porque algunos
           teclados USB en Android pueden entregar diferentes
           valores.
        ===================================================== */

        document.addEventListener(
            'keydown',
            function (event) {

                const tecla =
                    event.key.toLowerCase();

                const codigo =
                    event.code;


                /* W */

                if (
                    tecla === 'w' ||
                    codigo === 'KeyW'
                ) {

                    teclas.w = true;

                    event.preventDefault();

                }


                /* A */

                if (
                    tecla === 'a' ||
                    codigo === 'KeyA'
                ) {

                    teclas.a = true;

                    event.preventDefault();

                }


                /* S */

                if (
                    tecla === 's' ||
                    codigo === 'KeyS'
                ) {

                    teclas.s = true;

                    event.preventDefault();

                }


                /* D */

                if (
                    tecla === 'd' ||
                    codigo === 'KeyD'
                ) {

                    teclas.d = true;

                    event.preventDefault();

                }


                /* SHIFT */

                if (
                    event.key === 'Shift' ||
                    codigo === 'ShiftLeft' ||
                    codigo === 'ShiftRight'
                ) {

                    teclas.shift = true;

                }


                console.log(
                    'Tecla:',
                    event.key,
                    'Código:',
                    event.code
                );

            },
            {
                passive: false
            }
        );


        /* =====================================================
           SOLTAR TECLAS
        ===================================================== */

        document.addEventListener(
            'keyup',
            function (event) {

                const tecla =
                    event.key.toLowerCase();

                const codigo =
                    event.code;


                if (
                    tecla === 'w' ||
                    codigo === 'KeyW'
                ) {

                    teclas.w = false;

                }


                if (
                    tecla === 'a' ||
                    codigo === 'KeyA'
                ) {

                    teclas.a = false;

                }


                if (
                    tecla === 's' ||
                    codigo === 'KeyS'
                ) {

                    teclas.s = false;

                }


                if (
                    tecla === 'd' ||
                    codigo === 'KeyD'
                ) {

                    teclas.d = false;

                }


                if (
                    event.key === 'Shift' ||
                    codigo === 'ShiftLeft' ||
                    codigo === 'ShiftRight'
                ) {

                    teclas.shift = false;

                }

            },
            {
                passive: false
            }
        );


        /* =====================================================
           MOVIMIENTO DEL CAMERA RIG
           
           ESTA ES LA PARTE MÁS IMPORTANTE.
           
           NO MOVEMOS LA CÁMARA.
           
           MOVEMOS cameraRig.
        ===================================================== */

        AFRAME.registerComponent(
            'teclado-movimiento',
            {

                init: function () {

                    this.rig =
                        document.querySelector(
                            '#cameraRig'
                        );

                    this.camera =
                        document.querySelector(
                            '#camera'
                        );

                    this.tmpDirection =
                        new THREE.Vector3();

                    this.tmpRight =
                        new THREE.Vector3();

                },


                tick: function (
                    time,
                    delta
                ) {

                    if (!this.rig) {

                        return;

                    }


                    if (!this.camera) {

                        return;

                    }


                    /* Evitar movimientos gigantes */

                    if (delta > 100) {

                        delta = 100;

                    }


                    /* =========================================
                       VELOCIDAD
                    ========================================= */

                    let velocidad = 0.004;


                    if (teclas.shift) {

                        velocidad = 0.010;

                    }


                    const movimiento =
                        velocidad * delta;


                    /* =========================================
                       ROTACIÓN HORIZONTAL DE LA CÁMARA
                       
                       El celular controla la cámara.
                       
                       El rig solamente usa Y.
                    ========================================= */

                    const rotacion =
                        this.camera.object3D.rotation;


                    const yaw =
                        rotacion.y;


                    /* =========================================
                       DIRECCIÓN HACIA ADELANTE
                    ========================================= */

                    const forwardX =
                        -Math.sin(yaw);

                    const forwardZ =
                        -Math.cos(yaw);


                    /* =========================================
                       DIRECCIÓN DERECHA
                    ========================================= */

                    const rightX =
                        Math.cos(yaw);

                    const rightZ =
                        -Math.sin(yaw);


                    const posicion =
                        this.rig.object3D.position;


                    /* =========================================
                       W
                    ========================================= */

                    if (teclas.w) {

                        posicion.x +=
                            forwardX *
                            movimiento;

                        posicion.z +=
                            forwardZ *
                            movimiento;

                    }


                    /* =========================================
                       S
                    ========================================= */

                    if (teclas.s) {

                        posicion.x -=
                            forwardX *
                            movimiento;

                        posicion.z -=
                            forwardZ *
                            movimiento;

                    }


                    /* =========================================
                       A
                    ========================================= */

                    if (teclas.a) {

                        posicion.x -=
                            rightX *
                            movimiento;

                        posicion.z -=
                            rightZ *
                            movimiento;

                    }


                    /* =========================================
                       D
                    ========================================= */

                    if (teclas.d) {

                        posicion.x +=
                            rightX *
                            movimiento;

                        posicion.z +=
                            rightZ *
                            movimiento;

                    }


                    /*
                     * El rig siempre permanece a nivel del suelo.
                     */

                    posicion.y = 0;

                }

            }
        );


        /* =====================================================
           ACTIVAR COMPONENTE DE MOVIMIENTO
        ===================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                const rig =
                    document.querySelector(
                        '#cameraRig'
                    );


                if (rig) {

                    rig.setAttribute(
                        'teclado-movimiento',
                        ''
                    );

                }

            }
        );


        /* =====================================================
           SENSOR DEL CELULAR
        ===================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                const boton =
                    document.querySelector(
                        '#activar-sensores'
                    );


                if (!boton) {

                    return;

                }


                boton.addEventListener(
                    'click',
                    async function () {


                        /*
                         * iPhone / iPad
                         */

                        if (
                            typeof DeviceOrientationEvent !==
                            'undefined' &&

                            typeof DeviceOrientationEvent
                                .requestPermission ===
                            'function'
                        ) {

                            try {

                                const permiso =
                                    await
                                    DeviceOrientationEvent
                                        .requestPermission();


                                if (
                                    permiso ===
                                    'granted'
                                ) {

                                    console.log(
                                        'Sensores activados.'
                                    );

                                    boton.style.display =
                                        'none';

                                }

                                else {

                                    alert(
                                        'No se concedió permiso para usar los sensores.'
                                    );

                                }

                            }

                            catch (error) {

                                console.error(
                                    'Error con el sensor:',
                                    error
                                );

                            }

                        }


                        /*
                         * Android
                         */

                        else {

                            console.log(
                                'Android: los sensores pueden utilizarse directamente.'
                            );

                            boton.style.display =
                                'none';

                        }

                    }
                );

            }
        );


        /* =====================================================
           ENTRAR A VR
        ===================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                const scene =
                    document.querySelector(
                        'a-scene'
                    );


                if (!scene) {

                    return;

                }


                scene.addEventListener(
                    'enter-vr',
                    function () {

                        console.log(
                            'Entrando en modo VR.'
                        );

                        console.log(
                            'Controles USB: W A S D.'
                        );

                        console.log(
                            'SHIFT = correr.'
                        );

                    }
                );


                scene.addEventListener(
                    'exit-vr',
                    function () {

                        console.log(
                            'Saliendo del modo VR.'
                        );

                    }
                );

            }
        );


        /* =====================================================
           EVITAR QUE LAS TECLAS SE QUEDEN PRESIONADAS
        ===================================================== */

        window.addEventListener(
            'blur',
            function () {

                teclas.w = false;
                teclas.a = false;
                teclas.s = false;
                teclas.d = false;
                teclas.shift = false;

            }
        );


        /* =====================================================
           VISIBILIDAD DE LA PÁGINA
        ===================================================== */

        document.addEventListener(
            'visibilitychange',
            function () {

                if (
                    document.hidden
                ) {

                    teclas.w = false;
                    teclas.a = false;
                    teclas.s = false;
                    teclas.d = false;
                    teclas.shift = false;

                }

            }
        );


        /* =====================================================
           MENSAJES DE CONSOLA
        ===================================================== */

        console.log(
            '========================================'
        );

        console.log(
            'MUSEO VIRTUAL DE TECNOLOGÍA'
        );

        console.log(
            'Sistema de movimiento iniciado.'
        );

        console.log(
            'W = avanzar'
        );

        console.log(
            'S = retroceder'
        );

        console.log(
            'A = izquierda'
        );

        console.log(
            'D = derecha'
        );

        console.log(
            'SHIFT = correr'
        );

        console.log(
            'Teclado USB compatible.'
        );

        console.log(
            'Modo VR compatible.'
        );

        console.log(
            '========================================'
        );


    </script>

</body>

</html>
