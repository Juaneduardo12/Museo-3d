<script>

AFRAME.registerComponent('mostrar-informacion', {

    init: function () {

        this.el.addEventListener('click', () => {

            const tituloInfo =
                this.el.getAttribute('data-titulo');

            const textoInfo =
                this.el.getAttribute('data-info');

            const panel =
                document.querySelector('#panel-info');

            const titulo =
                document.querySelector('#info-titulo');

            const texto =
                document.querySelector('#info-texto');


            if (!panel || !titulo || !texto) {

                console.error(
                    "No se encontró el panel de información."
                );

                return;
            }


            /* ==========================================
               ACTUALIZAR INFORMACIÓN
            ========================================== */

            titulo.setAttribute(
                'value',
                tituloInfo
            );

            texto.setAttribute(
                'value',
                textoInfo
            );


            /* ==========================================
               OBTENER POSICIÓN DEL PANEL
            ========================================== */

            const x =
                parseFloat(
                    this.el.getAttribute('data-panel-x')
                );

            const y =
                parseFloat(
                    this.el.getAttribute('data-panel-y')
                );

            const z =
                parseFloat(
                    this.el.getAttribute('data-panel-z')
                );


            /* ==========================================
               COLOCAR PANEL
            ========================================== */

            panel.setAttribute(
                'position',
                `${x} ${y} ${z}`
            );


            /* ==========================================
               ROTACIÓN DEL PANEL
            ========================================== */

            panel.setAttribute(
                'rotation',
                '0 0 0'
            );


            /* ==========================================
               MOSTRAR PANEL
            ========================================== */

            panel.setAttribute(
                'visible',
                'true'
            );

        });

    }

});


/* =====================================================
   BOTÓN CERRAR
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const botonCerrar =
            document.querySelector('#btn-cerrar');

        const panel =
            document.querySelector('#panel-info');


        if (botonCerrar) {

            botonCerrar.addEventListener(
                'click',
                function () {

                    panel.setAttribute(
                        'visible',
                        'false'
                    );

                }
            );

        }

    }
);

document.querySelector('#activar-sensores').addEventListener('click', function () {

    const scene = document.querySelector('a-scene');

    if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
    ) {

        DeviceOrientationEvent.requestPermission()
            .then(function (permission) {

                if (permission === 'granted') {
                    console.log('Sensor activado');
                }

            })
            .catch(function (error) {
                console.error(error);
            });

    } else {

        console.log('Movimiento del celular activado');

    }

    this.style.display = 'none';
});


</script>
